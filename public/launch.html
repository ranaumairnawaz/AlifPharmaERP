<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launching Alif Pharma...</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: white;
            overflow: hidden;
        }
        .container {
            text-align: center;
            position: relative;
            z-index: 10;
        }
        .loader {
            width: 80px;
            height: 80px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem;
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin: 0;
            opacity: 0.8;
        }
        p {
            margin-top: 10px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--primary);
            filter: blur(100px);
            opacity: 0.2;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="container">
        <div class="glass">
            <div class="loader"></div>
            <h1>ALIF PHARMA</h1>
            <p id="status">Initializing high-performance hub...</p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const dynamicHost = urlParams.get('host') || 'localhost';
        const targetUrl = `http://${dynamicHost}:8000`;
        const statusEl = document.getElementById('status');
        
        async function checkServer() {
            try {
                // We use a small timeout and 'no-cors' to just check if the server responds at all
                const controller = new AbortController();
                const id = setTimeout(() => controller.abort(), 2000);
                
                const response = await fetch(targetUrl, { 
                    mode: 'no-cors', 
                    signal: controller.signal 
                });
                
                clearTimeout(id);
                statusEl.textContent = 'Server ready! Redirecting...';
                
                // Give it a tiny bit of extra time to ensure Laravel is fully ready
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 500);
            } catch (error) {
                // Server not ready yet, wait and try again
                setTimeout(checkServer, 1000);
            }
        }

        // Start checking
        checkServer();
    </script>
</body>
</html>
