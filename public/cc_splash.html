<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #0f172a;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }
        .container { text-align: center; }
        .logo { width: 100px; height: 100px; margin-bottom: 20px; animation: pulse 2s infinite; }
        .loader { width: 40px; height: 4px; background: #1e293b; border-radius: 2px; margin: 10px auto; overflow: hidden; }
        .bar { width: 40%; height: 100%; background: #6366f1; animation: slide 1.5s infinite ease-in-out; }
        h1 { font-size: 0.8rem; letter-spacing: 0.2rem; color: #94a3b8; font-weight: bold; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(0.98); } }
        @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    </style>
</head>
<body>
    <div class="container">
        <img src="alif-logo.png" class="logo" alt="Logo">
        <h1>ALIF PHARMA</h1>
        <div class="loader"><div class="bar"></div></div>
    </div>
</body>
</html>
