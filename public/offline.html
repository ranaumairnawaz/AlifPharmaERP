<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Unreachable - AlifPharma</title>
    <style>
        :root {
            --brand-primary: #0d9488;
            --brand-bg: #020617;
            --brand-text: #f1f5f9;
        }
        body {
            font-family: 'Outfit', system-ui, -apple-system, sans-serif;
            background-color: var(--brand-bg);
            color: var(--brand-text);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            backdrop-filter: blur(20px);
            max-width: 480px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: float 6s ease-in-out infinite;
        }
        .logo {
            width: 120px;
            margin-bottom: 30px;
            filter: drop-shadow(0 0 20px rgba(13, 148, 136, 0.3));
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 10px;
            color: #ffffff;
            letter-spacing: -0.5px;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.6;
            font-weight: 400;
        }
        .pulse {
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: #ef4444;
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            animation: pulsing 2s infinite;
        }
        .status-container {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 50px;
            color: #fca5a5;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin: 0 auto 30px auto;
            width: fit-content;
        }
        .btn {
            display: inline-block;
            padding: 16px 32px;
            background: var(--brand-primary);
            color: white;
            text-decoration: none;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(13, 148, 136, 0.2);
            cursor: pointer;
            border: none;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(13, 148, 136, 0.4);
            background: #14b8a6;
        }
        .btn:active {
            transform: translateY(1px);
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        @keyframes pulsing {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .bg-grid {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="container">
        <img src="/alif-logo.png" alt="Alif Pharma Logo" class="logo">
        <div class="status-container">
            <span class="pulse"></span>
            Server Disconnected
        </div>
        <h1>Connection Lost</h1>
        <p>You are currently accessing AlifPharma Systems without an active internet or local connection to the host server. Please verify your network and try again.</p>
        <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    </div>
</body>
</html>
