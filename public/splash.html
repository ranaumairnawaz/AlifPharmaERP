<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            -webkit-app-region: drag;
        }

        .logo-container {
            width: 160px;
            margin-bottom: 30px;
            filter: drop-shadow(0 20px 40px rgba(13, 148, 136, 0.2));
            animation: pulse-glow 2s infinite ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .title {
            font-size: 20px;
            font-weight: 900;
            color: #0f172a;
            letter-spacing: -0.04em;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 11px;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.3em;
        }

        .progress-bar {
            width: 240px;
            height: 4px;
            background: #f1f5f9;
            border-radius: 4px;
            margin-top: 40px;
            position: relative;
            overflow: hidden;
        }

        .progress-line {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 40%;
            background: #0d9488;
            border-radius: 4px;
            animation: progress-move 1.5s infinite ease-in-out;
        }

        @keyframes progress-move {
            0% { left: -40%; }
            100% { left: 100%; }
        }

        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 20px 40px rgba(13, 148, 136, 0.2)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 25px 50px rgba(13, 148, 136, 0.4)); }
        }
    </style>
</head>

<body>
    <div class="logo-container">
        <img src="alif-logo.png" style="width: 100%; height: auto;" alt="Alif Pharma Logo">
    </div>
    <div class="title">Alif Pharma Desktop</div>
    <div class="subtitle">Secure Systems Initialization</div>
    <div class="progress-bar">
        <div class="progress-line"></div>
    </div>
</body>

</html>
